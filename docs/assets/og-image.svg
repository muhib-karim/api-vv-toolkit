<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">api-vv-toolkit</title>
<desc id="desc">Requirements in. Verdicts out. Every test traced. Beside the headline, a sheet of requirement cells, most marked with a check and two with a cross.</desc>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1c1917" stroke-opacity=".07"/></pattern>
<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset=".3" stop-color="#f7f5f0" stop-opacity="0"/><stop offset="1" stop-color="#f7f5f0"/></linearGradient>
<g id="pass"><rect width="62" height="56" rx="6" fill="#e2f1e5"/><path d="M21 29l7 7 14-15" fill="none" stroke="#136c3a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="fail"><rect width="62" height="56" rx="6" fill="#a4161a"/><path d="M23 20l16 16M39 20L23 36" fill="none" stroke="#f7f5f0" stroke-width="4.5" stroke-linecap="round"/></g>
</defs>
<rect width="1200" height="630" fill="#f7f5f0"/>
<rect width="1200" height="630" fill="url(#grid)"/>
<rect width="1200" height="630" fill="url(#fade)"/>
<g transform="translate(72 60)"><rect width="46" height="46" rx="10.5" fill="#1c1917"/><path d="M8.6 24.4h7.9l5 6.5L36 14.4" fill="none" stroke="#f7f5f0" stroke-width="4.3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="134" y="92" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="26" font-weight="700" fill="#1c1917">api-vv-toolkit</text>
<g font-family="P052,'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-size="88" fill="#1c1917" letter-spacing="-2.4">
<text x="68" y="252">Requirements in.</text>
<text x="68" y="346">Verdicts out.</text>
<text x="68" y="440">Every test <tspan font-style="italic">traced.</tspan></text>
</g>
<path d="M452 460h196" stroke="#1c1917" stroke-width="3" stroke-linecap="round"/>
<g font-family="'DejaVu Sans',Arial,Helvetica,sans-serif" font-size="24" fill="#57514b">
<text x="72" y="528">OpenAPI and written requirements in, API tests and a</text>
<text x="72" y="562">requirement-to-verdict traceability matrix out, gated in CI.</text>
</g>
<rect x="842" y="184" width="304" height="232" rx="12" fill="#dcd7cd"/>
<rect x="832" y="174" width="304" height="232" rx="12" fill="#fffdf9" stroke="#1c1917" stroke-width="2"/>
<g transform="translate(850 192)">
<use href="#pass"/><use href="#pass" x="68"/><use href="#fail" x="136"/><use href="#pass" x="204"/>
<use href="#pass" y="70"/><use href="#pass" x="68" y="70"/><use href="#pass" x="136" y="70"/><use href="#fail" x="204" y="70"/>
<use href="#pass" y="140"/><use href="#pass" x="68" y="140"/><use href="#pass" x="136" y="140"/><use href="#pass" x="204" y="140"/>
</g>
</svg>
