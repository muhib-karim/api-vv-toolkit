version: '1.0'
spec:
  openapi: 3.1.0
  title: Widget demo
  operations:
    health:
      id: health
      method: GET
      path: /health
      parameters: []
      request_schema: null
      request_required: false
      request_media_type: application/json
      responses:
        '200':
          content:
            application/json:
              type: object
              required:
              - status
              additionalProperties: false
              properties:
                status:
                  type: string
                  const: ok
          headers:
            X-Service-Version:
              required: true
              schema:
                type: string
                const: '1.0'
      security: []
    createWidget:
      id: createWidget
      method: POST
      path: /widgets
      parameters: []
      request_schema:
        type: object
        required:
        - name
        - role
        - age
        additionalProperties: false
        properties:
          name:
            type: string
            minLength: 1
            maxLength: 8
            example: widget
          role:
            type: string
            enum:
            - reader
            - writer
            default: reader
          age:
            type: integer
            minimum: 0
            maximum: 120
            default: 30
      request_required: true
      request_media_type: application/json
      responses:
        '201':
          content:
            application/json:
              type: object
              required:
              - id
              - name
              additionalProperties: false
              properties:
                id:
                  type: integer
                name:
                  type: string
          headers: {}
        '422':
          content:
            application/json:
              type: object
              required:
              - error
              additionalProperties: false
              properties:
                error:
                  type: string
          headers: {}
      security: []
    getWidget:
      id: getWidget
      method: GET
      path: /widgets/{widget_id}
      parameters:
      - name: widget_id
        location: path
        required: true
        schema:
          type: integer
        example: 1
      request_schema: null
      request_required: false
      request_media_type: application/json
      responses:
        '200':
          content:
            application/json:
              type: object
              required:
              - id
              - name
              additionalProperties: false
              properties:
                id:
                  type: integer
                name:
                  type: string
          headers: {}
        '404':
          content:
            application/json:
              type: object
              required:
              - error
              additionalProperties: false
              properties:
                error:
                  type: string
          headers: {}
        '422':
          content:
            application/json:
              type: object
              required:
              - error
              additionalProperties: false
              properties:
                error:
                  type: string
          headers: {}
      security: []
    deleteWidget:
      id: deleteWidget
      method: DELETE
      path: /widgets/{widget_id}
      parameters:
      - name: widget_id
        location: path
        required: true
        schema:
          type: integer
        example: 1
      request_schema: null
      request_required: false
      request_media_type: application/json
      responses:
        '204':
          content: {}
          headers: {}
        '422':
          content:
            application/json:
              type: object
              required:
              - error
              additionalProperties: false
              properties:
                error:
                  type: string
          headers: {}
      security: []
    secure:
      id: secure
      method: GET
      path: /secure
      parameters: []
      request_schema: null
      request_required: false
      request_media_type: application/json
      responses:
        '200':
          content:
            application/json:
              type: object
              required:
              - authorized
              properties:
                authorized:
                  type: boolean
                  const: true
          headers: {}
        '401':
          content:
            application/json:
              type: object
              required:
              - error
              additionalProperties: false
              properties:
                error:
                  type: string
          headers: {}
      security:
      - DemoKey: []
  security_schemes:
    DemoKey:
      type: apiKey
      name: X-API-Key
      location: header
      scheme: null
  webhooks: []
requirements:
  requirements:
  - id: REQ-001
    text: The health endpoint returns its status and service version header.
    priority: must
    verification_method: test
    covers:
    - operation_id: health
      responses:
      - '200'
      checks:
      - happy-path
    latency_ms: null
  - id: REQ-002
    text: A valid widget can be created.
    priority: must
    verification_method: test
    covers:
    - operation_id: createWidget
      responses:
      - '201'
      checks:
      - happy-path
    latency_ms: null
  - id: REQ-003
    text: A widget name longer than eight characters is rejected.
    priority: must
    verification_method: test
    covers:
    - operation_id: createWidget
      responses:
      - '422'
      checks:
      - boundary:name:maxLength:above
      - llm-scenario
    latency_ms: null
  - id: REQ-004
    text: A widget must include a name.
    priority: must
    verification_method: test
    covers:
    - operation_id: createWidget
      responses:
      - '422'
      checks:
      - required:name
      - llm-scenario
    latency_ms: null
  - id: REQ-005
    text: A widget name must be a string.
    priority: must
    verification_method: test
    covers:
    - operation_id: createWidget
      responses:
      - '422'
      checks:
      - wrong-type:name
      - llm-scenario
    latency_ms: null
  - id: REQ-006
    text: Widget roles are restricted to the documented enum.
    priority: must
    verification_method: test
    covers:
    - operation_id: createWidget
      responses:
      - '422'
      checks:
      - enum:role
      - llm-scenario
    latency_ms: null
  - id: REQ-007
    text: The secure endpoint rejects unauthenticated requests.
    priority: must
    verification_method: test
    covers:
    - operation_id: secure
      responses:
      - '401'
      checks:
      - auth-required
      - llm-scenario
    latency_ms: null
  - id: REQ-008
    text: Deleting a widget returns 204 with no body.
    priority: must
    verification_method: test
    covers:
    - operation_id: deleteWidget
      responses:
      - '204'
      checks:
      - happy-path
      - llm-scenario
    latency_ms: null
  - id: REQ-009
    text: Reading a widget returns a schema-valid representation.
    priority: must
    verification_method: test
    covers:
    - operation_id: getWidget
      responses:
      - '200'
      checks:
      - happy-path
      - llm-scenario
    latency_ms: null
  - id: REQ-010
    text: Reading absent widget 999 returns a documented not-found response.
    priority: must
    verification_method: test
    covers:
    - operation_id: getWidget
      responses:
      - '404'
      checks:
      - llm-scenario
    latency_ms: null
  - id: REQ-011
    text: A one-character widget name is accepted.
    priority: must
    verification_method: test
    covers:
    - operation_id: createWidget
      responses:
      - '201'
      checks:
      - boundary:name:minLength:at
    latency_ms: null
  - id: REQ-012
    text: The health endpoint responds within one second in this local demo.
    priority: should
    verification_method: test
    covers:
    - operation_id: health
      responses:
      - '200'
      checks:
      - happy-path
    latency_ms: 1000.0
