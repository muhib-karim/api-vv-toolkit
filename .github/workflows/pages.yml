name: Demo report

# Runs the seeded-defect demo against the bundled loopback API and publishes a landing page
# with that live run (gate verdict, transcript, evidence files) plus the HTML traceability
# matrix to GitHub Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: only the deploy job may publish to Pages and mint its OIDC token.
permissions:
  contents: read

# A newer push queues behind a running deployment instead of cutting it off midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[demo]'
      - run: python scripts/demo.py
      # Landing page + matrix + raw evidence, built from this run; nothing is committed by hand.
      - name: Assemble site
        run: python scripts/build_site.py runs/demo site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
