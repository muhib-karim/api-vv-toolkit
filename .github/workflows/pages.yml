name: Demo report

# Runs the seeded-defect demo against the bundled loopback API and publishes a landing page
# with that live run (gate verdict, transcript, evidence files) plus the HTML traceability
# matrix to GitHub Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: only the deploy job may publish to Pages and mint its OIDC token.
permissions:
  contents: read

# A newer push queues behind a running deployment instead of cutting it off midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[demo]'
      - run: python scripts/demo.py
      # Landing page + matrix + raw evidence, built from this run; nothing is committed by hand.
      - name: Assemble site
        run: python scripts/build_site.py runs/demo site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
