name: Demo report

# Runs the seeded-defect demo against the bundled loopback API and publishes a landing page
# with that live run (gate verdict, transcript, evidence files) plus the HTML traceability
# matrix to GitHub Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[demo]'
      - run: python scripts/demo.py
      # Landing page + matrix + raw evidence, built from this run; nothing is committed by hand.
      - name: Assemble site
        run: python scripts/build_site.py runs/demo site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
