name: Release

# On a vX.Y.Z tag: test, build wheel + sdist with SHA256SUMS.txt, and publish the GitHub release
# with the committed RELEASE_NOTES_<tag>.md as its body. The floating major tag (v1) used by
# `uses: muhib-karim/api-vv-toolkit@v1` is moved by a maintainer after the release is checked.

on:
  push:
    # Full versions only: moving the floating major tag (v1) must not start a release run,
    # which would fail on the missing RELEASE_NOTES_v1.md.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach artifacts to (e.g. v1.3.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Release notes and version match the tag
        run: |
          test -f "RELEASE_NOTES_${TAG}.md" || { echo "::error::missing RELEASE_NOTES_${TAG}.md"; exit 1; }
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          test "v${VERSION}" = "$TAG" || { echo "::error::pyproject version ${VERSION} does not match ${TAG}"; exit 1; }
      - name: Test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,demo]'
          ruff check .
          mypy --strict src
          python -m pytest -q -p no:cacheprovider
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
          VERSION="${TAG#v}"
          ls dist | grep -q "$VERSION" || { echo "dist does not match $TAG"; ls dist; exit 1; }
          cd dist && sha256sum ./* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Check the wheel installs and runs
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install dist/*.whl
          test "$(cd /tmp && /tmp/v/bin/api-vv --version)" = "${TAG#v}"
      - name: Publish to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file "RELEASE_NOTES_${TAG}.md"
          else
            gh release create "$TAG" dist/* --title "$TAG" \
              --notes-file "RELEASE_NOTES_${TAG}.md" --verify-tag
          fi
