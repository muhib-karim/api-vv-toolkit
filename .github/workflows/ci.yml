name: CI

on:
  push:
    branches: [main, "upgrade/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev,demo]'
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check (strict, package)
        run: mypy --strict src
      - name: Test with coverage gate (>= 85%)
        run: pytest -q -p no:cacheprovider --cov-report=xml --cov-fail-under=85
      - name: Contract drift fixtures (breaking must exit 1, compatible 0)
        run: |
          api-vv diff tests/fixtures/diff/v1.yaml tests/fixtures/diff/v2-compatible.yaml
          set +e
          api-vv diff tests/fixtures/diff/v1.yaml tests/fixtures/diff/v2-breaking.yaml --format md
          test $? -eq 1
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage-xml
          path: coverage.xml

  build:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel and smoke-test it outside the source tree
        run: |
          python -m pip wheel --no-deps -w dist .
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-env/bin/api-vv --version

  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.21.2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tgz gitleaks
          rm gitleaks.tgz
      - name: Scan history and working tree
        run: |
          ./gitleaks git --no-banner --redact .
          ./gitleaks dir --no-banner --redact .

  demo:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[demo]'
      # scripts/demo.py exits non-zero unless the gate fails on exactly REQ-003 and REQ-008.
      - run: python scripts/demo.py
      - name: Check the gate named exactly the two seeded defects
        run: |
          grep -Fx 'Gate: FAIL (REQ-003, REQ-008)' runs/demo/cli-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-report
          path: |
            runs/demo/report.html
            runs/demo/junit.xml
            runs/demo/traceability.csv

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t api-vv:ci .
      - name: Smoke test
        run: |
          docker run --rm api-vv:ci --version
          docker run --rm -v "$PWD/examples/demo_api:/data:ro" api-vv:ci \
            validate-requirements --spec /data/openapi.yaml --requirements /data/requirements.yaml
