name: CI

on:
  push:
    branches: [main, "upgrade/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev,demo]'
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check (strict; package, then tests, scripts and examples)
        run: |
          mypy --strict src
          mypy
      - name: Test with coverage gate (>= 85%)
        run: pytest -q -p no:cacheprovider --cov-report=xml --cov-fail-under=85
      - name: Contract drift fixtures (breaking must exit 1, compatible 0)
        run: |
          api-vv diff tests/fixtures/diff/v1.yaml tests/fixtures/diff/v2-compatible.yaml
          set +e
          api-vv diff tests/fixtures/diff/v1.yaml tests/fixtures/diff/v2-breaking.yaml --format md
          test $? -eq 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.python-version == '3.12'
        with:
          name: coverage-xml
          path: coverage.xml

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build the wheel and smoke-test it outside the source tree
        run: |
          python -m pip wheel --no-deps -w dist .
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-env/bin/api-vv --version

  audit:
    name: audit (dependencies, workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PIP_AUDIT_VERSION: 2.10.1
      ZIZMOR_VERSION: 1.32.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # The tools get their own environment so they never audit themselves.
      - name: Install pinned audit tools
        run: |
          python -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install --quiet \
            "pip-audit==${PIP_AUDIT_VERSION}" "zizmor==${ZIZMOR_VERSION}"
      - name: Known vulnerabilities in what a user installs (runtime and demo extras)
        run: |
          python -m venv "$RUNNER_TEMP/project"
          "$RUNNER_TEMP/project/bin/pip" install --quiet '.[demo]'
          "$RUNNER_TEMP/project/bin/pip" freeze --exclude api-vv-toolkit > "$RUNNER_TEMP/requirements.txt"
          "$RUNNER_TEMP/tools/bin/pip-audit" --requirement "$RUNNER_TEMP/requirements.txt" \
            --no-deps --disable-pip
      - name: Workflow security (pinned actions, token permissions, template injection)
        run: |
          "$RUNNER_TEMP/tools/bin/zizmor" --offline --min-severity medium .github/workflows action.yml

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.21.2
      # sha256 of gitleaks_8.21.2_linux_x64.tar.gz from the release's checksums file.
      GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      # Installed outside the checkout so the directory scan never reads its own binary.
      - name: Install gitleaks (checksum verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan history and working tree
        run: |
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact .
          "$RUNNER_TEMP/gitleaks" dir --no-banner --redact .

  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[demo]'
      # scripts/demo.py exits non-zero unless the gate fails on exactly REQ-003 and REQ-008.
      - run: python scripts/demo.py
      - name: Check the gate named exactly the two seeded defects
        run: |
          grep -Fx 'Gate: FAIL (REQ-003, REQ-008)' runs/demo/cli-output.txt
      - name: Committed sample reports match this run (regenerate them with `make demo`)
        run: |
          cmp docs/sample-report.md runs/demo/report.md
          cmp docs/sample-traceability.csv runs/demo/traceability.csv
      - name: Build the Pages site from this run (preview; deployed from main only)
        run: python scripts/build_site.py runs/demo site
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: demo-report
          path: |
            runs/demo/report.html
            runs/demo/junit.xml
            runs/demo/traceability.csv
            site/

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: docker build -t api-vv:ci .
      - name: Smoke test
        run: |
          docker run --rm api-vv:ci --version
          docker run --rm -v "$PWD/examples/demo_api:/data:ro" api-vv:ci \
            validate-requirements --spec /data/openapi.yaml --requirements /data/requirements.yaml
