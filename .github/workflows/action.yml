name: Action dogfood

# Runs this repository's own composite action (uses: ./) the way a consumer would, and checks
# its outputs: the gate must fail on exactly the two seeded defects, and drift must be
# classified correctly for both fixture revisions.

on:
  push:
    branches: [main, "upgrade/**"]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Start the bundled demo API
        env:
          API_VV_DEMO_KEY: demo-only-key
        # The demo app imports api_vv itself; the action under test installs its own copy.
        run: |
          python -m pip install --quiet '.[demo]'
          python -m uvicorn examples.demo_api.app:app --port 8000 --no-access-log > demo.log 2>&1 &
          for _ in $(seq 50); do
            if curl -fs http://127.0.0.1:8000/health; then exit 0; fi
            sleep 0.2
          done
          echo "::error::demo API did not start"; cat demo.log; exit 1
      - id: vv
        uses: ./
        env:
          API_VV_DEMO_KEY: demo-only-key
        with:
          spec: examples/demo_api/openapi.yaml
          requirements: examples/demo_api/requirements.yaml
          config: examples/demo_api/config.yaml
          base-url: http://127.0.0.1:8000
          property-cases: "5"
          seed: "7"
          llm: "true"
          fail-on-gate: "false"
      - name: The gate named exactly the seeded defects
        env:
          GATE: ${{ steps.vv.outputs.gate }}
          FAILED: ${{ steps.vv.outputs.failed-requirements }}
          JUNIT: ${{ steps.vv.outputs.junit }}
        run: |
          echo "gate=$GATE failed=$FAILED junit=$JUNIT"
          test "$GATE" = fail
          test "$FAILED" = "REQ-003,REQ-008"
          test -s "$JUNIT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: action-dogfood-report
          path: api-vv-report/

  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: compatible
        uses: ./
        with:
          spec: tests/fixtures/diff/v2-compatible.yaml
          baseline-spec: tests/fixtures/diff/v1.yaml
          out-dir: drift-compatible
      - id: breaking
        uses: ./
        with:
          spec: tests/fixtures/diff/v2-breaking.yaml
          baseline-spec: tests/fixtures/diff/v1.yaml
          fail-on-breaking: "false"
          out-dir: drift-breaking
      - name: Drift outputs
        env:
          COMPATIBLE: ${{ steps.compatible.outputs.breaking-changes }}
          BREAKING: ${{ steps.breaking.outputs.breaking-changes }}
          GATE: ${{ steps.breaking.outputs.gate }}
        run: |
          echo "compatible=$COMPATIBLE breaking=$BREAKING gate=$GATE"
          test "$COMPATIBLE" = 0
          test "$BREAKING" -gt 0
          test "$GATE" = skipped
