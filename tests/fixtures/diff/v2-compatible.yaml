# Backward-compatible revision of v1.yaml, migrated to OpenAPI 3.1.
# Renamed operationIds and path placeholders, and `nullable` -> type arrays, are not changes.
openapi: 3.1.0
info: {title: Shop, version: 1.1.0}
components:
  securitySchemes:
    Key: {type: apiKey, in: header, name: X-Key}
  schemas:
    Order:
      type: object
      required: [id, status, total]
      properties:
        id: {type: integer}
        status: {type: string, enum: [new, paid, shipped]}
        total: {type: number, minimum: 0}
        note: {type: [string, 'null']}
        currency: {type: string}
    NewOrder:
      type: object
      required: [sku]
      additionalProperties: false
      properties:
        sku: {type: string, maxLength: 12}
        qty: {type: integer, minimum: 1, maximum: 10}
        priority: {type: string, enum: [low, normal, high, urgent]}
        gift: {type: boolean}
paths:
  /orders:
    get:
      operationId: listOrders
      parameters:
        - {name: limit, in: query, schema: {type: integer, maximum: 200}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Order'}}
    post:
      operationId: placeOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewOrder'}
      responses:
        '201':
          description: created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '409': {description: duplicate}
        '422': {description: invalid}
  /orders/{id}:
    get:
      operationId: fetchOrder
      parameters: [{name: id, in: path, schema: {type: integer}}]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
    delete:
      operationId: deleteOrder
      security: [{Key: []}]
      parameters: [{name: id, in: path, schema: {type: integer}}]
      responses:
        '204': {description: deleted}
        '401': {description: unauthenticated}
  /orders/{id}/items:
    get:
      operationId: listItems
      parameters: [{name: id, in: path, schema: {type: integer}}]
      responses:
        '200': {description: ok}
  /legacy:
    get:
      operationId: legacy
      responses:
        '200': {description: ok}
webhooks:
  orderShipped:
    post:
      responses:
        '200': {description: ok}
