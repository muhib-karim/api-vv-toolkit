# Deliberately breaking revision of v1.yaml; every change below must be reported as breaking.
openapi: 3.1.0
info: {title: Shop, version: 2.0.0}
components:
  securitySchemes:
    Key: {type: apiKey, in: header, name: X-Key}
  schemas:
    Order:
      type: object
      required: [id]                                        # status no longer guaranteed
      properties:
        id: {type: string}                                  # integer -> string
        status: {type: string, enum: [new, paid, shipped]}
        note: {type: [string, 'null']}                      # total removed
    NewOrder:
      type: object
      required: [sku, currency]                             # new required property
      additionalProperties: false
      properties:
        sku: {type: string, maxLength: 12}
        qty: {type: integer, minimum: 1, maximum: 5}        # maximum tightened
        priority: {type: string, enum: [normal, high]}      # enum value removed
        currency: {type: string}
paths:
  /orders:
    get:
      operationId: listOrders
      parameters:
        - {name: limit, in: query, schema: {type: integer, maximum: 100}}
        - {name: tenant, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Order'}}
    post:
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewOrder'}
      responses:
        '200':                                              # was 201
          description: created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '422': {description: invalid}
  /orders/{orderId}:
    get:
      operationId: getOrder
      security: [{Key: []}]                                 # was open
      parameters: [{name: orderId, in: path, schema: {type: integer}}]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '401': {description: unauthenticated}
        '404': {description: missing}
